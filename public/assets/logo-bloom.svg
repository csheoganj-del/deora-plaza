<svg xmlns="http://www.w3.org/2000/svg" width="220" height="44" viewBox="0 0 220 44" fill="none">
  <defs>
    <linearGradient id="bloom-grad" x1="0" y1="0" x2="220" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7B679"/>
      <stop offset="0.5" stop-color="#CA9A2C"/>
      <stop offset="1" stop-color="#9A7016"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="12" y1="12" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0FA3B1"/>
      <stop offset="1" stop-color="#0A6C75"/>
    </linearGradient>
  </defs>

  <!-- Premium Subtle Background -->
  <rect x="1" y="1" width="218" height="42" rx="10" fill="url(#bloom-grad)" opacity="0.08"/>
  <rect x="1" y="1" width="218" height="42" rx="10" stroke="url(#bloom-grad)" stroke-width="1.5" opacity="0.25"/>

  <!-- Logo Icon: Abstract Cup + Bloom Leaf -->
  <!-- Cup Base -->
  <path d="M 12 16 C 12 28, 16 32, 22 32 C 28 32, 32 28, 32 16 Z" fill="url(#bloom-grad)" opacity="0.8"/>
  <path d="M 16 14 C 16 24, 18 28, 22 28 C 26 28, 28 24, 28 14 Z" fill="#1C1C1E"/>
  
  <!-- Leaf/Bloom coming out of cup -->
  <path d="M 22 20 C 14 14, 16 6, 22 6 C 28 6, 30 14, 22 20 Z" fill="url(#leaf-grad)"/>

  <!-- Text -->
  <g fill="url(#bloom-grad)" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700">
    <text x="44" y="27" font-size="18" letter-spacing="1.5">BLOOM CAFE</text>
  </g>
</svg>
